[package]
name = "rcgui-plugin-imagehost"
version = "0.3.0"
edition = "2021"
description = "RCGUI 插件：基于 rclone 的图床（上传 / 去重 / 索引 / 直链）"
license = "MIT"
repository = "https://github.com/h897105167/rcgui-plugin-imagehost"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
