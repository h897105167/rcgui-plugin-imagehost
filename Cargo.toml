[package]
name = "rcgui-plugin-imagehost"
version = "0.6.1"
edition = "2021"
description = "RCGUI 插件：基于 rclone 的图床（上传 / 去重 / 索引 / 直链 / HTTP 上传服务）"
license = "MIT"
repository = "https://github.com/h897105167/rcgui-plugin-imagehost"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
base64 = "0.22"
# 超限压缩用：只开 png/jpeg/webp 三种解码器，别把 tiff/exr 那些也拖进来。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
